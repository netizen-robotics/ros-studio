[workspace]
members = ["crates/protocol", "crates/backend", "crates/desktop", "crates/images", "crates/inspection", "crates/workspace", "crates/visualization", "crates/ui-foundation", "crates/client-core", "crates/visualizer", "crates/tools", "crates/launcher", "crates/app-lifecycle", "crates/network"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
