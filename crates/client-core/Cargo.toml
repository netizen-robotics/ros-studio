[package]
name = "studio-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
studio-protocol = { path = "../protocol" }
studio-images = { path = "../images" }
studio-visualization = { path = "../visualization", optional = true }
serde_json.workspace = true
studio-ui-foundation = { path = "../ui-foundation" }
studio-network = { path = "../network" }
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[features]
spatial = ["dep:studio-visualization"]
test-support = []

[[example]]
name = "description-budget"
required-features = ["test-support"]

[[example]]
name = "map-session"
required-features = ["test-support"]

[[example]]
name = "marker-session"
required-features = ["test-support"]

[[example]]
name = "pose-session"
required-features = ["test-support"]
