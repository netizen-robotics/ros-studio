[workspace]
name = "ros-studio-feasibility"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
rust = "=1.92.0"
ros-jazzy-ros-base = "=0.11.0"
ros-jazzy-rmw-fastrtps-cpp = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-example-interfaces = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-tf2-msgs = "*"
libclang = "*"
cmake = "*"
ninja = "*"
ros-jazzy-map-msgs = { version = "==2.4.1", build = "*_25" }
ros-jazzy-nav2-msgs = ">=1.3.12,<1.4"

# Keep the existing platform ROS ABI when adding dynamically loaded interfaces.
[target.osx-arm64.dependencies]
ros2-distro-mutex = { version = "==0.16.0", build = "jazzy_21" }

[target.osx-64.dependencies]
ros2-distro-mutex = { version = "==0.16.0", build = "jazzy_21" }

[target.linux-64.dependencies]
ros2-distro-mutex = { version = "==0.19.0", build = "jazzy_25" }

[target.linux-aarch64.dependencies]
ros2-distro-mutex = { version = "==0.19.0", build = "jazzy_25" }

[target.win-64.dependencies]
ros2-distro-mutex = { version = "==0.19.0", build = "jazzy_25" }
